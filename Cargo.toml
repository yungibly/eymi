[package]
name = "eymi"
version = "0.1.0"
edition = "2024"
description = "A source-preserving terminal Markdown editor"

[dependencies]
arboard = { version = "3.6", default-features = false }
crossterm = "0.28"
pulldown-cmark = "0.13"
ratatui = "0.29"
tempfile = "3"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
