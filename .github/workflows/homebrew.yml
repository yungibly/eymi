name: Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  formula:
    name: Verify public archives and generate formula
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Verify anonymous downloads and render formula
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 tools/release/homebrew.py fetch --tag "$RELEASE_TAG" --output release-assets
          python3 tools/release/homebrew.py render --tag "$RELEASE_TAG" --archives release-assets --output formula/eymi.rb
          ruby -c formula/eymi.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: formula/eymi.rb
          if-no-files-found: error

  install:
    name: Install and test (${{ matrix.os }})
    needs: formula
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula
      - name: Find Linux Homebrew
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install the published archive and run the formula test
        run: |
          tap="$(brew --repository)/Library/Taps/yungibly/homebrew-release-test"
          mkdir -p "$tap/Formula"
          cp formula/eymi.rb "$tap/Formula/eymi.rb"
          git -C "$tap" init
          brew install yungibly/release-test/eymi
          brew test yungibly/release-test/eymi

  update:
    name: Update yungibly/tap
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula
      - name: Commit the verified formula
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          BREW_TAP_TOKEN: ${{ secrets.BREW_TAP_TOKEN }}
        run: python3 tools/release/homebrew.py update --tag "$RELEASE_TAG" --formula formula/eymi.rb
